##### ARTHEA #####
caduceus:
  base: caduceus
  name: Caduceus
  lore:
    description:
     - "Right click to pull a dwarf\n
        to your location."
    flavour:
     - "Swoooosh."
  modifiers:
    attack: 20
    knockback: 2
    kb_resist: 1

totem:
  base: asclepius
  name: Asclepius
  lore:
    description:
     - "Right click to heal and buff dwarves\n
        at the cost of your own mana. Left\n
        click to give all dwarves a shield."
    flavour:
     - "Illuminate!"

luminous:
  base: ebow
  name: "Luminous"
  lore:
    description:
     - "Shoots a powerful beam of light,\n
        which gives procs to dwarves and\n
        pierces 50% arrow resistance."
    flavour:
     - "\"Forward, dwarves! Let the light guide you.\" - Arthea"

elystria:
  base: elystria
  name: Elystria The Divine Blade
  lore:
    description:
     - "The true form of Caduceus.\n
        You have 1 minute to live.\n
        Slay as much as you can."
    flavour:
     - "For the eternal light."
  modifiers:
    attack: 60
    kb_resist: 1
  shiny: true


