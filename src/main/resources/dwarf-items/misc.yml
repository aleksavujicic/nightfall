pick:
  material: iron_pickaxe
  name: Dwarven Pickaxe
  lore:
    description:
     - "Right click on others to \n
        repair armour using gold.\n
        Right click on a piston to\n
        make gold blocks to make armour."
    flavour:
     - "This pickaxe is mighty indeed."

axe:
  material: iron_axe
  name: Dwarven Axe
  lore:
    description:
     - "Break wood blocks to chop trees for logs."
    flavour:
     - "Sometimes it's a makeshift weapon."

shovel:
  material: iron_spade
  name: Dwarven Shovel
  lore:
    description:
     - "Used to dig gravel for cobblestone."
    flavour:
     - "The real gravediggers use these."

arrow:
  material: arrow
  name: Arrow
  lore:
    description:
     - "Dwarven Ammo.\n
        Regenerates over time."
    flavour:
     - "\"How am I supposed to hit skellies without a bow!?\" - Tui"


# Tombmaker special reward items
perfect-torch:
  template: dwarf-hero
  material: torch
  name: The True Perfect Torch
  shiny: true
  lore:
    description:
     - "After many years of experimentation,\n
        we have been able to create the one\n
        true perfect torch."
    flavour:
     - "Except it doesn't protect you from\n
        the darkness."

clover:
  template: dwarf-hero
  base: temp
  name: Four Leaf Clover
  shiny: true
  lore:
    description:
     - "Only the luckiest have been,\n
        able to find this rare clover ."
    flavour:
     - ""

