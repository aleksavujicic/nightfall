drb:
  base: runesword
  name: Lesser Runesword
  lore:
    description:
     - "A runesword that has yet to be enchanted\n
        with &bwind&r magic."
    flavour:
     - "\"Not the best, but eh... It can make do.\" - Arthea"
     - "\"That blade could do with a bit of sharpening.\" - Velvetine"
     - "\"Hey it's not &othat&r bad, I've seen worse things used as weapons!\" - Tui"
  modifiers:
    attack: 15

runesword:
  base: runesword
  name: Mystic Runesword
  lore:
    description:
     - "Right click to &brunedash&r into\n
        monsters, damaging or killing them\n
        instantly with a proc."
    flavour:
     - "\"Keep PROC'ing Jimmy! You can't stop now.\" - Velvetine"
  modifiers:
    attack: 15

greatsword:
  base: runesword
  name: Loremasters Greatsword
  lore:
    description:
     - "A broken and heavy weapon\n
        that prevents constant swinging."
    flavour:
     - "\"I d�r hir comes, a hon reign shall n- uireb.\" -Loremaster"
  modifiers:
    attack: 25

axe:
  base: blood-axe
  name: Bloodied Waraxe
  lore:
    description:
     - "Right click to go into a &4Blood rage&r,\n
        allowing you to proc, regaining health and mana\n
        for a short duration."
    flavour:
     - "\"You &oreally&r shouldn't be using that thing on rats.\" - Arthea"
  modifiers:
    attack: 20

hammer:
  base: hammer
  name: Warhammer
  lore:
    description:
     - "Right click to roar, which gives you\n
        strength for a short time and attracts\n
        nearby AIs toward you. Deals AOE Damage."
    flavour:
     - "\"Time to really prove what you're worth.\" - Tui"
  modifiers:
    attack: 10

dagger:
  base: dagger
  name: Elven Dagger
  lore:
    description:
       - "An elven blade, light but deadly.\n
          Right click to &bEviscerate&r a monster,\n
          dealing massive damage. Takes 4 minutes to\n
          charge, 3 seconds reduction per kill."
    flavour:
     - "\"Put that speed to good use, and that poison to better use.\" - Velvetine"
     - "\"I can't keep up with you jimmy! You're too fast!!\" - Tui"
  modifiers:
    attack: 20
    speed: 30
    kb-resist: 25

rapier:
  base: rapier
  name: Rapier
  lore:
    description:
      - "Hitting player controlled mobs grants\n
         a stack up to &b40&r stacks for &b50&r max attack.\n
         Right click to leap forward, using &e8&r stacks."
    flavour:
      - "\"Strike at their weak points, and then finish them quickly.\" - Velvetine"
  modifiers:
    attack: 15

glaive:
  base: glaive
  name: Glaive
  lore:
    description:
      - "Right click to spin.\n
        Drk plz change"
    flavour:
      - "\"Finally the hammer is getting changed!\" - Everyone"
  modifiers:
    attack: 15

scepter:
  base: scepter
  name: Arcane Scepter
  lore:
    description:
      - "Left click to shoot a beam that damages mobs,\n
        and buffs dwarves. Right click to create a\n
        buffpool that strengthens all dwarves inside it."
    flavour:
      - "\"This makes one less dwarf to watch over.\" - Arthea"
      - "\"When buff pools appear, its huddle time!\" - Tui"
      - "\"Stand proud, and help those that fight.\" - Velvetine"

hunting:
  base: hunting
  name: Hunting Claws
  lore:
    description:
     - "Temp"
    flavour:
     - "Temp"
  modifiers:
    attack: 20

soulblade:
  base: soulblade
  name: Soulblade
  lore:
    description:
      - "Attacking enemy monsters absorbs\n
         their soul, storing 4 damage per hit.\n
         Right click to release the charge,\n
         dealing damage and knockback.\n
         Requires at least 10 stacks to release."
    flavour:
      - "\"This blade will lay these creatures to rest.\" - Arthea"
  modifiers:
    attack: 15