# ------ BOWS ------
longbow:
  index: 9
  type: item
  name: longbow
  category: bow
  cost: 18
  item:
    name: "Longbow"
    base: longbow
    lore:
      description:
       - "Shooting player controlled mobs\n
          temporarily increases bow power by &b20&r,\n
          for a max of &b200&r power for &e10 seconds&r.\n
          Shooting AI controlled mobs lengthens\n
          the increase time by &e2 seconds&r."
    modifiers:
      power: 80

volcanic:
  index: 10
  type: item
  name: volcanic
  category: bow
  cost: 18
  item:
    name: "Volcanic Gauntlet"
    base: volcanic
    lore:
      description:
       - "Charge up a lined blast of fire\n
          that pierces everything in\n
          its path. Uses 3 arrows a shot."
    modifiers:
      attack: 15
      power: 70

dragonskin:
  index: 11
  type: item
  name: dragonskin
  category: bow
  cost: 16
  item:
    name: "Phoenix Bow"
    base: dskin
    lore:
      description:
       - "Left click to enable &bPower Shot Mode&r.\n
          Power shots do &b200&r power damage that\n
          pierces half of target arrow resistance\n
          and gives a &b5&r second proc on kill.\n
          Cooldown of &e30s&r."
    modifiers:
      power: 50

crossbow:
  index: 12
  type: item
  name: crossbow
  category: bow
  cost: 16
  item:
    name: "Crossbow"
    base: crossbow
    lore:
      description:
       - "A crossbow that can fire with\n
          no draw time.\n
          Uses two arrows and has a\n
          slight reload time."
    modifiers:
      power: 100

lightbow:
  index: 13
  type: item
  name: lightbow
  category: bow
  cost: 12
  item:
    name: "Lightbow"
    base: lightbow
    lore:
      description:
       - "This bow fires special arrows that\n
          create lamps in the walls.\n
          Pierces half of target arrow resistance.\n
          You are also immune to darkness."
    modifiers:
      power: 30

ebow:
  index: 14
  type: item
  name: ebow
  category: bow
  cost: 12
  item:
    name: "Emerald Bow"
    base: ebow
    lore:
      description:
       - "A magical bow, made from emerald.\n
          Shooting other dwarves gives them\n
          a short duration proc."
    modifiers:
      power: 10

warpweaver:
  index: 15
  type: item
  name: warpweaver
  category: bow
  cost: 12
  item:
    name: "Warpweaver Bow"
    base: warpweaver
    lore:
      description:
       - "Left click to activate effect.\n
          When activated, you will teleport\n
          to where the arrow lands.\n
          Getting hit will cancel the teleport.\n
          Uses 15 arrows per warp, with no\n
          cooldown."
    modifiers:
      power: 30

turret:
  enabled: false
  index: 17
  type: item
  name: turret
  category: bow
  cost: 16
  item:
    name: "Turret"
    material: dispenser
    lore:
      description:
       - "A turret that fires arrows."
    modifiers:
      power: 80



# ------ ALES ------
