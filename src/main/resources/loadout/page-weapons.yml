    material: diamond
    lore:
      description:
       - "Left click to heal yourself\n
          for &b100&r mana.\n
          Right click on dwarves to heal\n
          them and their armour for &b20&r mana."
    modifiers:
      mana-cost: 100

chug:
  index: 22
  type: item
  name: chugging_ale
