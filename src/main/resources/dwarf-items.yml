hero:
  tuihammer:
    template: dwarf-hero
    base: tui_hammer
    name: Kindled Light
    shiny: true
    lore:
      description:
       - "Temp"
      flavour:
       - "Rank 11? Psssh, that’s nothing. When you’ve lived your whole\n
          life with the flames, the holy light is all you see. I’ve bathed\n
          in embers, emerged victorious from scorching coals. This\n
          hammer’s been with me through it all."
    modifiers:
      attack: 25
      kb_resist: 1

  wildfire:
    template: dwarf-hero
    base: wildfire
    name: Wildfire
    lore:
      description:
       - "Temp"
      flavour:
       - "Temp"

