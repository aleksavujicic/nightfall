sword:
  drb:
    base: runeblade
    name: Dwarven Runeblade
    lore:
      description:
       - "A runeblade that has yet to be enchanted\n
          with &bwind&r magic."
      flavour:
       - "These blades can still kill a monster\n
          You are just going to have a\n
          tougher time doing it."
    modifiers:
      attack: 15
  grb:
    base: runeblade
    name: Greater Runeblade
    lore:
      description:
       - "A fully procable weapon\n
          Right click to &brunedash&r into\n
          monsters heavily damaging or killing them\n
          instantly with a proc."
      flavour:
       - "The mighty weapon thats said to send\n
          dwarves into a fury of &bsparkles&r."
    modifiers:
      attack: 15
  axe:
    base: malice
    name: Axe of Malice
    lore:
      description:
       - "Right click to go into a &4Bloodrage&r\n
          allowing you to proc for a short duration."
      flavour:
       - "Be careful with those ones jimmy, they've\n
          gone &cmad&r."
    modifiers:
      attack: 20
  dagger:
    base: dagger
    name: Elven Dagger
    lore:
      description:
       - "Right click to &bEviscerate&r a monster\n
          dealing massive damage."
      flavour:
       - "A dagger used long ago by keen elven allies,\n 
      now passed down to the dwarves that can keep up with\n 
      it's great speed. Equipped with an ancient pointed\n
      poison that seeps through the skin of any that dares\n 
      threaten it."
       - "Forged with the &2worst of poisons&r and given\n
          to only the quickest of &efoot&r and &bmind&r."
    modifiers:
      attack: 15
      speed: 30
  hammer:
    base: hammer
    name: Warhammer
    lore:
      description:
       - "Right click to regenerate armour and mana
          over time."
      flavour:
       - "\"Take this and battle alongside me for all\n
          that's right, for the &e&olight&r!\" - &4Tui"
    modifiers:
      attack: 10
  tombmaker:
    base: tombmaker
    name: Tombmaker
    lore:
      description:
       - "A shovel with the ability to roll procs\n
          Right click for a Haste buff to dig faster."
      flavour:
       - "Entrusted with the toughest task of all,\n
          burying the fallen. &9Why not let them fight?"
    modifiers:
      attack: 8
  tigerfist:
    base: tiger_fist
    name: Tiger Fist
    lore:
      description:
       - "Right click and hold for\n
          a fully charged and constant leap\n
          that extends with each monster\n
          killed."
      flavour:
       - "Wait these are Fists? It kinda looks like a shield."
    modifiers:
      attack: 20

bow:
  shortbow:
    material: bow
    name: Shortbow
    lore:
      description:
       - "A bow made with oak wood and\n
          hempen rope."
      flavour:
       - "Not very strong is it?\n
          Well it is a shortbow after all."
  dragonskin:
    material: bow
    name: Dragonskin Bow
    lore:
      description:
       - "Kills with this bow\n
          gives a proc for 3 seconds."
      flavour:
       - "Rawr,Rawr,Rawwwwwwwr."
  longbow:
    material: bow
    name: Longbow
    lore:
      description:
       - "Kills with this bow stack\n
          up to 6 times for a total\n
          of 200 Power."
      flavour:
       - "27..28...29!"
  crossbow:
    base: crossbow
    name: Crossbow
    lore:
      description:
       - "A special bow made to fire\n
          immediately with no draw time\n
          has a slight reload time."
      flavour:
       - "Real dwarves use crossbows\n
          not some fancy elven bow."
  lightbow:
    base: lightbow
    name: Lightbow
    lore:
      description:
       - "This bow fires special arrows that\n
          create lamps in the walls\n
          You are also immune to darkness."
      flavour:
       - "No lamp jumping for you Jimmy!."
  ebow:
    base: ebow
    name: Emerald Bow
    lore:
      description:
       - "A very fragile and weak bow\n
          Monsters hit with this bow\n
          give off a proc to dwarves\n
          within range."
      flavour:
       - "I'm sure glad we found use for the rest of\n
          that Emerald City."
  warpweaver:
    base: warpbow
    name: Warpweaver Bow
    lore:
      description:
       - "Shooting an arrow with this bow\n
          cause you to switch places with it\n
          for a few seconds before\n
          warping back."
      flavour:
       - "No endermen were harmed in\n
          the crafting of this bow."
ale:
  healing:
    base: healing_ale
    name: Healing Ale
    lore:
      description:
       - "Left click to heal yourself for &b100&r mana."
      flavour:
       - "Manual healing takes time\n
          to learn, but once you\n
          master it, you will\n
          last longer than any\n
          Jimmy Juicer."
  jj:
    base: jimmyjuice
    name: Jimmy Juice
    lore:
      description:
       - "The starting ale for new players\n
          Auto heal for &b125&r mana or\n
          Left Click to heal for &b100&r mana."
      flavour:
       - "Drink your juice Jimmy!"
  holy:
    base: holy_ale
    name: Holy Ale
    lore:
      description:
       - "Left click to heal yourself\n
          for 100 mana and gain\n
          &b8 absorption hearts*r"
      flavour:
       - "Holy ale is NOT light beer\n
          it's light ale."
  trinket:
    base: trinket
    name: Star Trinket
    lore:
      description:
       - "Left click to heal yourself\n
          for &b200&r mana and gain\n
          &b20 absorption hearts&r\n
          You also gain perma regen."
      flavour:
       - "Star Trinket is not Regrowth Star!."
  regrowth:
    base: regrowth
    name: Regrowth Star
    lore:
      description:
       - "Left click to heal yourself\n
          for &b100&r mana\n
          Right click on dwarves heals\n
          them and their armour at the cost\n
          of your mana."
      flavour:
       - "Regrowth Star is not Star Trinket!."

