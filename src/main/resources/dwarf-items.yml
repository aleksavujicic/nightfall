sword:
  drb:
    base: runeblade
    name: Dwarven Runeblade
    lore:
      description:
       - "And another test."
      flavour:
       - "What a crappy weapon."
    modifiers:
      attack: 15
  grb:
    base: runeblade
    name: Greater Runeblade
    lore:
      description:
       - "Some description &dof&r sorts. This is\n
          also a maven test."
       - "And another test."
      flavour:
       - "The mighty weapon thats said to send\n
          dwarves into a fury of &bsparkles&r."
    modifiers:
      attack: 15
  axe:
    base: malice
    name: Axe of Malice
    lore:
      description:
       - "Temp"
      flavour:
       - "Be careful with those ones jimmy, they've\n
          gone &cmad&r."
    modifiers:
      attack: 20
  dagger:
    base: dagger
    name: Elven Dagger
    lore:
      description:
       - "Temp"
      flavour:
      - "A dagger used long ago by keen elven allies,\n 
      now passed down to the dwarves that can keep up with\n 
      it's great speed. Equipped with an ancient pointed\n
      poison that seeps through the skin of any that dares\n 
      threaten it.
       - "Forged with the &2worst of poisons&r and given\n
          to only the quickest of &efoot&r and &bmind&r."
    modifiers:
      attack: 15
      speed: 30
  hammer:
    base: hammer
    name: Warhammer
    lore:
      description:
       - "Temp"
      flavour:
       - "\"Take this and battle alongside me for all\n
          that's right, for the &e&olight&r!\" - &4Tui"
    modifiers:
      attack: 10
  tombmaker:
    base: tombmaker
    name: Tombmaker
    lore:
      description:
       - "Temp"
      flavour:
       - "Entrusted with the toughest task of all,\n
          burying the fallen. &9Why not let them fight?"
    modifiers:
      attack: 8
  tigerfist:
    base: tiger_fist
    name: Tiger Fist
    lore:
      description:
       - "Temp"
      flavour:
       - "Temp"
    modifiers:
      attack: 20

