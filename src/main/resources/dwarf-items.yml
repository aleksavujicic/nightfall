sword:
  drb:
    base: runeblade
    name: Lesser Runeblade
    lore:
      description:
       - "A runeblade that has yet to be enchanted\n
          with &bwind&r magic."
      flavour:
       - "\"Not the best, but eh... It can make do.\" - Arthea"
       - "\"That blade could do with a bit of sharpening.\" - Velvetine"
       - "\"Hey it's not &othat&r bad, I've seen worse things used as weapons!\" - Tui"
    modifiers:
      attack: 15
  grb:
    base: runeblade
    name: Greater Runeblade
    lore:
      description:
       - "Right click to &brunedash&r into\n
          monsters, damaging or killing them\n
          instantly with a proc."
      flavour:
       - "\"Keep PROC'ing Jimmy! You can't stop now.\" - Velvetine"
    modifiers:
      attack: 15
  greatsword:
    base: runeblade
    name: Loremasters Greatsword
    lore:
      description:
       - "A broken and heavy weapon\n
          that prevents constant swinging."
      flavour:
       - "\"I d�r hir comes, a hon reign shall n- uireb.\" -Loremaster"
    modifiers:
      attack: 25
  axe:
    base: malice
    name: Axe of Malice
    lore:
      description:
       - "Right click to go into a &4Blood rage&r,\n
          allowing you to proc, regaining health and mana\n
          for a short duration."
      flavour:
       - "\"You &oreally&r shouldn't be using that thing on rats.\" - Arthea"
    modifiers:
      attack: 20
  hammer:
    base: hammer
    name: Warhammer
    lore:
      description:
       - "Right click to regenerate armour and mana
          over time."
      flavour:
       - "\"Time to really prove what you're worth.\" - Tui"
    modifiers:
      attack: 15
  dagger:
    base: dagger
    name: Elven Dagger
    lore:
      description:
       - "An elven blade, dipped in poison.\n
          Right click to &bEviscerate&r a monster,\n
          dealing massive damage."
      flavour:
       - "\"Put that speed to good use, and that poison to better use.\" - Velvetine"
       - "\"I can't keep up with you jimmy! You're too fast!!\" - Tui"
    modifiers:
      attack: 20
      speed: 30
  rapier:
    base: rapier
    name: Rapier
    lore:
      description:
        - "Hitting player controlled mobs grants\n
           a stack up to &b20&r stacks for &b50&r max attack.\n
           Right click to leap forward, using &e5&r stacks."
      flavour:
        - "\"Strike at their weak points, and then finish them quickly.\" - Velvetine"
    modifiers:
      attack: 10
  glaive:
    base: glaive
    name: Glaive
    lore:
      description:
        - "Right click to spin.\n
          Drk plz change"
      flavour:
        - "\"Finally the hammer is getting changed!\" - Everyone"
    modifiers:
      attack: 15
  scepter:
    base: scepter
    name: Scepter of Magma
    lore:
      description:
        - "Left click to release waves of fire\n
           upon your foes. Right click to channel\n
           flames around you for &b$manacost&r mana\n
           damaging mobs."
      flavour:
        - "Insert Flavour Text Here"
    modifiers:
      attack: 10
  hunting:
    base: hunting
    name: Hunting Claws
    lore:
      description:
       - "Temp"
      flavour:
       - "Temp"
    modifiers:
      attack: 20
  shadowblade:
    base: dagger
    name: Shadow Blade
    lore:
      description:
        - "Drk fix this."
      flavour:
        - "Drk fix this."
    modifiers:
      attack: 15
      speed: 30

bow:
  shortbow:
    material: bow
    name: Shortbow
    lore:
      description:
       - "A bow made with oak wood and\n
          hempen rope."
      flavour:
       - "\"Don't insult it, I've used this thing plenty of times.\" - Velvetine"
  dragonskin:
    base: dskin
    name: Dragonskin Bow
    lore:
      description:
       - "Left click to enable &bPower Shot Mode&r.\n
          Power shots do &b125&r power damage that\n
          pierces half of target arrow resistance\n
          and gives a &b5&r second proc on kill.\n
          Cooldown of &e30s&r."
      flavour:
       - "\"Feel the PROC pulsing through your bow.\" - Velvetine"
  longbow:
    base: longbow
    name: Longbow
    lore:
      description:
       - "Kills with this bow stack\n
          up to 25 times for a total\n
          of &b210&r Power, losing &b30&r power over\n
          &e8 seconds&r without a kill."
      flavour:
       - "\"Aim for the wolves, they're ankle-biters!\" - Velvetine"
  crossbow:
    base: crossbow
    name: Crossbow
    lore:
      description:
       - "A crossbow that can fire with no draw time.\n
          Uses two arrows and has a slight reload time."
      flavour:
       - "\"What do you mean these take skill to use?\" - Arthea"
  lightbow:
    base: lightbow
    name: Lightbow
    lore:
      description:
       - "This bow fires special arrows that\n
          create lamps in the walls.\n
          Pierces half of target arrow resistance.\n
          You are also immune to darkness."
      flavour:
       - "\"Hey can I get some light? Thanks.\" - Tui"
  ebow:
    base: ebow
    name: Emerald Bow
    lore:
      description:
       - "A magical bow, made from emerald.\n
          Shooting other dwarves gives them\n
          a short duration proc."
      flavour:
       - "I'm sure glad we found use\n
          for the rest of that Emerald City."
  warpweaver:
    base: warpweaver
    name: Warpweaver Bow
    lore:
      description:
       - "Left click to activate effect.\n
          When activated, you will teleport\n
          to where the arrow lands.\n
          Getting hit will cancel the teleport."
      flavour:
       - "\"Hey look at this thing! Isn't it cool!?\" - Tui"
  turret:
    material: dispenser
    name: Turret
    lore:
      description:
       - "A turret that fires arrows."
      flavour:
       - "\"It still needs some work.\" - Nosovin"
  volcanic:
    base: volcanic
    name: Volcanic Gauntlet
    lore:
      description:
       - "Charge up a lined blast of fire\n
          that pierces everything in\n
          its path. Uses 3 arrows a shot."
      flavour:
       - "\"This gauntlet can even burn hellhounds.\" -Tui"
    modifiers:
      attack: 10

  minigun:
    base: crossbow
    name: Minigun
    lore:
      description:
       - "An automatic crossbow that will\n
          continue to fire until your arrows\n
          are depleted."
      flavour:
       - "Pew pew!"
  velbow:
    template: dwarf-hero
    base: dskin
    name: "Pyrrhic"
    lore:
      description:
       - "Kills with this bow give\n
          a proc for 5 seconds."
      flavour:
       - "\"Feel the PROC pulsing through your bow.\" - Velvetine"
  luminous:
    template: dwarf-hero
    base: ebow
    name: "Luminous"
    lore:
      description:
       - "Shoots a powerful beam of light,\n
          which gives procs to dwarves and\n
          pierces 50% arrow resistance."
      flavour:
       - "\"Forward, dwarves! Let the light guide you.\" - Arthea"

ale:
  healing:
    base: healing_ale
    name: Healing Ale
    lore:
      description:
       - "Left click to heal yourself for &b$manacost&r mana."
      flavour:
       - "\"Less fancier than the stars, but still nifty.\" - Arthea"
  jj:
    base: jimmyjuice
    name: Jimmy Juice
    lore:
      description:
       - "The starting ale for new players.\n
          Auto heal for &b$autocost&r mana or\n
          Left Click to heal for &b$manacost&r mana."
      flavour:
       - "\"I'm just glad that you &ocan&r drink your juice.\" - Velvetine"
  holy:
    base: holy_ale
    name: Holy Ale
    lore:
      description:
       - "Left click to heal yourself
         for &b$manacost&r mana\n and gain
         &b8&r absorption hearts."
      flavour:
       - "\"It's in the name! This things the holy grail of dwarves.\" - Tui"
  trinket:
    base: trinket
    name: Star Trinket
    lore:
      description:
       - "Left click to heal yourself\n
          for &b$manacost&r mana and gain\n
          &b20 absorption hearts&r.\n
          You also gain permanent regen."
      flavour:
       - "\"Drink your... Gem? How do you use this thing?\" - Velvetine"
  regrowth:
    base: regrowth
    name: Regrowth Star
    lore:
      description:
       - "Left click to heal yourself\n
          for &b100&r mana.\n
          Right click on dwarves to heal\n
          them and their armour for &b20&r mana."
      flavour:
       - "\"For those who want others to live another night.\" - Arthea"
  chug:
    base: chug
    name: Chugging Ale
    lore:
      description:
       - "Left click to heal for a small\n
          amount of health. Uses &b$manacost&r mana.\n
          You are able to spam this as much as you want\n
          so be careful and watch your mana!\n
          You also gain &espeed for 2.5 seconds&r each sip."
      flavour:
       - "\"One of Potion Sellers experimental potions. Use with care.\" "
  strong:
    base: strong
    name: Potion Seller's Strongest Potion
    lore:
      description:
       - "A very strong potion, which gives you %e75% resistance&r\n
          making you feel like a hero, however it uses &b$manacost&r mana."
      flavour:
       - "\"My potions are too strong for you traveller.\" - Potion Seller"
  glow:
    base: glow
    name: Healing Glow
    lore:
      description:
        - "Gain fire resistance and mana regeneration\n
           While taking fire damage. Costs &b$manacost&r mana."
      flavour:
        - "Hm, this stuff seems like it's boiling."

consumable:
  lamp:
    base: lamp
    name: Enchanted Lamp
    lore:
      description:
       - "Places a lamp down for &b60&r seconds."
      flavour:
       - "\"These aren't shiny; why are they called enchanted?\" - Velvetine"
  slab:
    base: slab
    name: EZ Fix Slab
    lore:
      description:
       - "Left click to summon a thick wall."
      flavour:
       - "\"Slab! And a slab! And another slab!\" - Tui"
  sos:
    base: sos
    name: Sword of Santification
    lore:
      description:
       - "Left click to call upon the mighty swords\n
          freezing mobs caught inside its area,\n
          and allowing you to finish them off."
      flavour:
       - "\"Better make them worthwhile, jimmy.\" - Velvetine"
  wrench:
    base: wrench
    name: Wrench
    lore:
      description:
       - "Left click to fully repair your\n
          dwarven armour at the cost of gold.\n
          Needs 50 gold to work."
      flavour:
       - "\"Who needs teamwork when you got these?\" - Tui"
  mortar:
    base: mortar
    name: Mortar
    lore:
      description:
       - "Left click to repair walls to their\n
          max level during build phase.\n
          Makes grey walls after mobs are released."
      flavour:
       - "Blue the walls dwarves."
  wizardmortar:
    base: wizmortar
    name: Wizard Mortar
    lore:
      description:
       - "Left click to fully repair walls to blue.\n
          Only works after mobs are released."
      flavour:
       - "Don't ask what makes it blue."
  armouritem:
    base: armour
    name: Dwarven Armour
    lore:
      description:
       - "Left click to armour a dwarf."
      flavour:
       - "Make sure every dwarf gets one."
  healstation:
    base: healitem
    name: Healing Station
    lore:
      description:
       - "Left click to place down a\n
          healing totem that gives an\n
          AoE &4Regen&r buff."
      flavour:
       - "\"Kinda like being a healer, but requires less work.\" - Arthea"

  log:
    base: logs
    name: Wooden Log
    lore:
      description:
       - "Right click on a saw to turn\n
          into wooden planks."
      flavour:
       - "Wood from a mighty oak tree."
  plank:
    base: planks
    name: Wooden Plank
    lore:
      description:
       - "Right click on a saw to turn\n
          into sticks."
      flavour:
       - "Planks from a mighty oak tree."
  stick:
    material: stick
    name: Stick
    lore:
      description:
       - "Right click on a saw to turn\n
          into bowls.\n
          Right click on oil to turn\n
          into a torch."
      flavour:
       - "A stick. Looks like a stick."
  bowl:
    material: bowl
    name: Wooden Bowl
    lore:
      description:
       - "Right click on oil to turn\n
          into mortar."
      flavour:
       - "It's a large bowl, could hold mortar."

  torch:
    material: torch
    name: Torch
    lore:
      description:
       - "Hold a torch in your hand\n
          makes you immune to darkness."
      flavour:
       - "Keeps the darkness away."
  cobble:
    material: cobblestone
    name: Cobblestone
    lore:
      description:
       - "Mined from gravel, turns into Bricks\n
          when mortared."
      flavour:
       - "It's stone."

misc:
  pick:
    material: iron_pickaxe
    name: Dwarven Pickaxe
    lore:
      description:
       - "Right click on others to \n
          repair armour using gold.\n
          Right click on a piston to\n
          make gold blocks to make armour."
      flavour:
       - "This pickaxe is mighty indeed."
  axe:
    material: iron_axe
    name: Dwarven Axe
    lore:
      description:
       - "Break wood blocks to chop trees for logs."
      flavour:
       - "Sometimes it's a makeshift weapon."
  shovel:
    material: iron_spade
    name: Dwarven Shovel
    lore:
      description:
       - "Used to dig gravel for cobblestone."
      flavour:
       - "The real gravediggers use these."

  tombmaker:
    base: tombmaker
    name: Tombmaker
    lore:
      description:
       - "Right click for a Haste buff to dig faster."
      flavour:
       - "\"I used to dig graves with these things. It's insane.\" - Tui"
       - "\"Two in the grave, two for the banshees.\" - Velvetine"
    modifiers:
      attack: 8

  arrow:
    material: arrow
    name: Arrow
    lore:
      description:
       - "Dwarven Ammo.\n
          Regenerates over time."
      flavour:
       - "\"How am I supposed to hit skellies without a bow!?\" - Tui"
  wildfirefuel:
    base: fireball
    name: Wildfire Fuel
    lore:
      description:
       - "Tui's Ammo for wildfire."
      flavour:
       - "Careful, its hot."

  compass:
    material: compass
    name: "Trusty Compass"
    lore:
      description:
       - "Left click to see current location.\n
          Right click to cycle through various\n
          locations on the map."
      flavour:
       - "A simple but useful tool."

  chesto:
    material: chest
    name: "Chest-o-matic"
    lore:
      description:
       - "Click to access the shared resource chest."
      flavour:
       - "Sharing is caring."


hero:
  tuihammer:
    template: dwarf-hero
    base: herohammer
    name: Kindled Light
    shiny: true
    lore:
      description:
       - "Right click to Roar, giving a proc and\n
          attracting all AIs to you."
      flavour:
        - |-
          Rank 11? Psssh, that's nothing. When you've lived your whole
          life with the flames, the holy light is all you see. I've bathed
          in embers, emerged victorious from scorching coals. This
          hammer's been with me through it all.
    modifiers:
      attack: 25
      kb_resist: 1
  wildfire:
    template: dwarf-hero
    base: flamestaff
    name: Wildfire
    lore:
      description:
       - "Right click to send out a stream\n
          of fire to harm mobs.\n
          Uses ammo."
      flavour:
       - "Begone foul demons of the night!"

  tinderflame:
    template: dwarf-hero
    base: tinderflame
    name: Not Tinderflame
    lore:
      description:
       - "Right click to shoot a beam\n
          at a mob dealing heavy damage\n
          and knocking you back."
      flavour:
       - "This thing cuts really well too."
    modifiers:
      attack: 20
  wand:
    template: dwarf-hero
    base: wand
    name: Wand of No Particular Reference
    lore:
      description:
       - "Right click to cast a\n
          Wormhole, pulling in all\n
          mobs near it."
      flavour:
       - "WOOORRMMMMHOOOLEEEE"
    modifiers:
      attack: 5
      kb_resist: 1

  caduceus:
    template: dwarf-hero
    base: caduceus
    name: Caduceus
    lore:
      description:
       - "Right click to pull a dwarf\n
          to your location."
      flavour:
       - "Swoooosh."
    modifiers:
      attack: 20
      knockback: 2
      kb_resist: 1
  totem:
    template: dwarf-hero
    base: hammer
    name: Asclepius
    lore:
      description:
       - "Right click to heal and buff dwarves\n
          at the cost of your own mana."
      flavour:
       - "Illuminate!"
  elystria:
    template: dwarf-hero
    base: elystria
    name: Elystria The Divine Blade
    lore:
      description:
       - "The true form of Caduceus.\n
          You have 1 minute to live.\n
          Slay as much as you can."
      flavour:
       - "For the eternal light."
    modifiers:
      attack: 60
      kb_resist: 1
    shiny: true

  velsword:
    template: dwarf-hero
    base: velsword
    name: "Nyneve"
    lore:
      description:
       - "The legendary runeblade.\n
          Twin to Elystria."
      flavour:
       - "\"It was there, glowing in the lake.\" - Velvetine"
    modifiers:
      attack: 25
      kb_resist: 1
    shiny: true
  horn:
    template: dwarf-hero
    base: horn
    name: Horn
    lore:
      description:
       - "Left click to send every dwarf\n
          into a powerful rampage!"
      flavour:
       - "Vroooooom!"
  drucrist:
    base: runeblade
    name: Drucrist
    lore:
      description:
        - "Drk fix this."
      flavour:
        - "Drk fix this."
    modifiers:
      attack: 20
  wildestaff:
    base: runeblade
    name: Wilde Staff
    lore:
      description:
        - "Drk fix this."
      flavour:
        - "Drk fix this."
    modifiers:
      attack: 5

