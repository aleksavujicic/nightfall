sword:
  drb:
    base: runeblade
    name: Dwarven Runeblade
    lore:
      description:
       - "A runeblade that has yet to be enchanted\n
          with &bwind&r magic."
      flavour:
       - "These blades can still kill a monster\n
          You are just going to have a\n
          tougher time doing it."
    modifiers:
      attack: 15
  grb:
    base: runeblade
    name: Greater Runeblade
    lore:
      description:
       - "A fully procable weapon\n
          Right click to &brunedash&r into\n
          monsters heavily damaging or killing them\n
          instantly with a proc."
      flavour:
       - "The mighty weapon thats said to send\n
          dwarves into a fury of &bsparkles&r."
    modifiers:
      attack: 15
  axe:
    base: malice
    name: Axe of Malice
    lore:
      description:
       - "Right click to go into a &4Bloodrage&r\n
          allowing you to proc for a short duration."
      flavour:
       - "Be careful with those ones jimmy, they've\n
          gone &cmad&r."
    modifiers:
      attack: 20
  dagger:
    base: dagger
    name: Elven Dagger
    lore:
      description:
       - "Right click to &bEviscerate&r a monster\n
          dealing massive damage."
      flavour:
       - "A dagger used long ago by keen elven allies,\n 
      now passed down to the dwarves that can keep up with\n 
      it's great speed. Equipped with an ancient pointed\n
      poison that seeps through the skin of any that dares\n 
      threaten it."
       - "Forged with the &2worst of poisons&r and given\n
          to only the quickest of &efoot&r and &bmind&r."
    modifiers:
      attack: 15
      speed: 30
  hammer:
    base: hammer
    name: Warhammer
    lore:
      description:
       - "Right click to regenerate armour and mana
          over time."
      flavour:
       - "\"Take this and battle alongside me for all\n
          that's right, for the &e&olight&r!\" - &4Tui"
    modifiers:
      attack: 10
  tombmaker:
    base: tombmaker
    name: Tombmaker
    lore:
      description:
       - "A shovel with the ability to roll procs\n
          Right click for a Haste buff to dig faster."
      flavour:
       - "Entrusted with the toughest task of all,\n
          burying the fallen. &9Why not let them fight?"
    modifiers:
      attack: 8
  tigerfist:
    base: tiger_fist
    name: Tiger Fist
    lore:
      description:
       - "Right click and hold for\n
          a fully charged and constant leap\n
          that extends with each monster\n
          killed."
      flavour:
       - "Wait these are Fists?\n
          It kinda looks like a shield."
    modifiers:
      attack: 20

bow:
  shortbow:
    material: bow
    name: Shortbow
    lore:
      description:
       - "A bow made with oak wood and\n
          hempen rope."
      flavour:
       - "Not very strong is it?\n
          Well it is a shortbow after all."
  dragonskin:
    material: bow
    name: Dragonskin Bow
    lore:
      description:
       - "Kills with this bow\n
          gives a proc for 3 seconds."
      flavour:
       - "Rawr,Rawr,Rawwwwwwwr."
  longbow:
    base: longbow
    name: Longbow
    lore:
      description:
       - "Kills with this bow stack\n
          up to 6 times for a total\n
          of 200 Power."
      flavour:
       - "27..28...29!"
  crossbow:
    base: crossbow
    name: Crossbow
    lore:
      description:
       - "A special bow made to fire\n
          immediately with no draw time\n
          has a slight reload time."
      flavour:
       - "Real dwarves use crossbows\n
          not some fancy elven bow."
  lightbow:
    base: lightbow
    name: Lightbow
    lore:
      description:
       - "This bow fires special arrows that\n
          create lamps in the walls\n
          You are also immune to darkness."
      flavour:
       - "No lamp jumping for you Jimmy!."
  ebow:
    base: ebow
    name: Emerald Bow
    lore:
      description:
       - "A very fragile and weak bow\n
          Monsters hit with this bow\n
          give off a proc to dwarves\n
          within range."
      flavour:
       - "I'm sure glad we found use\n
          for the rest of\n
          that Emerald City."
  warpweaver:
    base: warpbow
    name: Warpweaver Bow
    lore:
      description:
       - "Shooting an arrow with this bow\n
          cause you to switch places with it\n
          for a few seconds before\n
          warping back."
      flavour:
       - "No endermen were harmed in\n
          the crafting of this bow."
ale:
  healing:
    base: healing_ale
    name: Healing Ale
    lore:
      description:
       - "Left click to heal yourself for &b100&r mana."
      flavour:
       - "Manual healing takes time\n
          to learn, but once you\n
          master it, you will\n
          last longer than any\n
          Jimmy Juicer."
  jj:
    base: jimmyjuice
    name: Jimmy Juice
    lore:
      description:
       - "The starting ale for new players\n
          Auto heal for &b125&r mana or\n
          Left Click to heal for &b100&r mana."
      flavour:
       - "Drink your juice Jimmy!"
  holy:
    base: holy_ale
    name: Holy Ale
    lore:
      description:
       - "Left click to heal yourself
         for 100 mana and gain
         &b8&r absorption hearts."
      flavour:
       - "Holy ale is NOT light beer\n
          it's light ale."
  trinket:
    base: trinket
    name: Star Trinket
    lore:
      description:
       - "Left click to heal yourself\n
          for &b200&r mana and gain\n
          &b20 absorption hearts&r\n
          You also gain perma regen."
      flavour:
       - "Star Trinket is not Regrowth Star!."
  regrowth:
    base: regrowth
    name: Regrowth Star
    lore:
      description:
       - "Left click to heal yourself\n
          for &b100&r mana\n
          Right click on dwarves heals\n
          them and their armour at the cost\n
          of your mana."
      flavour:
       - "Regrowth Star is not Star Trinket!."

consumable:
  lamp:
    base: lamp
    name: Enchanted Lamp
    lore:
      description:
       - "Places a lamp down for &b60&r seconds."
      flavour:
       - "One if by land, two if by sea\n
          and three if by waves of undead hordes."
  slab:
    base: slab
    name: EZ Fix Slab
    lore:
      description:
       - "Left click to Summons a thick wall\n
          to patch in holes, or slow mobs."
      flavour:
       - "Rule 1 Don't wall off\n
          Rule 2 Don't slab mob heroes
          Rule 3 Don't slab Jimmys."
  sos:
    base: sos
    name: Sword of Santification
    lore:
      description:
       - "Left click to call upon the mighty sword\n
          freezing mobs caught inside its aoe\n
          and allowing you to finish them off."
      flavour:
       - "The old swords were just a test model\n
          these work much better!."
  wrench:
    base: wrench
    name: Wrench
    lore:
      description:
       - "Left click to fully repair your\n
          Dwarven armour at the cost of gold\n
          Needs gold to work."
      flavour:
       - "Good ol wrenchy, never leave home without it!."
  mortar:
    base: mortar
    name: Mortar
    lore:
      description:
       - "Left click to repair walls to their\n
          max level during build phase.\n
          Makes grey walls after mobs are released."
      flavour:
       - "Blue the walls dwarves!."
  wizardmortar:
    base: wiz_mortar
    name: Wizard Mortar
    lore:
      description:
       - "Left click toFully repair\n
          walls to blue\n
          Only works after mobs are released."
      flavour:
       - "Don't ask what makes it blue."
  armouritem:
    base: armour_item
    name: Dwarven Armour
    lore:
      description:
       - "Left click to armour a dwarf."
      flavour:
       - "Make sure every dwarf gets one!."
  healstation:
    base: star_bottle
    name: Healing Station
    lore:
      description:
       - "Left click to place down a\n
          healing totem that gives an\n
          AoE &4Regen&r buff."
      flavour:
       - "The dwarven clerics specialty\n
          use them wisely!."

  log:
    base: wood
    name: Wooden Log
    lore:
      description:
       - "Right click on a saw to turn\n
          into wooden planks."
      flavour:
       - "Wood. Mighty wood."
  plank:
    base: plank
    name: Wooden Plank
    lore:
      description:
       - "Right click on a saw to turn\n
          into sticks."
      flavour:
       - "Planks for a mighty oak tree."
  stick:
    material: stick
    name: Stick
    lore:
      description:
       - "Right click on a saw to turn\n
          into bowls.\n
          Right click on oil to turn\n
          into a torch."
      flavour:
       - "A stick - what else would it be?"
  bowl:
    base: bowl
    name: Wooden Bowl
    lore:
      description:
       - "Right click on oil to turn\n
          into mortar."
      flavour:
       - "Careful jimmy, it's very sticky."

  torch:
    material: torch
    name: Torch
    lore:
      description:
       - "Hold a torch in your hand\n
          makes you immune to darkness."
      flavour:
       - "But it's not the PERFECT torch."
  cobble:
    material: cobblestone
    name: Cobblestone
    lore:
      description:
       - "Mined from gravel, turns into Bricks\n
          when mortared."
      flavour:
       - "It's stone."

misc:
  pick:
    material: iron_pickaxe
    name: Dwarven Pickaxe
    lore:
      description:
       - "Right click to heal others armour\n
          using gold\n
          Right click on a piston to\n
          make gold blocks to make armour."
      flavour:
       - "This pickaxe is mighty indeed."
  axe:
    material: iron_axe
    name: Dwarven Axe
    lore:
      description:
       - "Right click to chop trees for logs."
      flavour:
       - "Sometimes it's a makeshift weapon."
  shovel:
    material: iron_spade
    name: Dwarven Shovel
    lore:
      description:
       - "Used to dig gravel for cobblestone."
      flavour:
       - "Not quite a tombmaker, but points for trying."

  arrow:
    material: arrow
    name: Arrow
    lore:
      description:
       - "Dwarven Ammo\n
          regens over time."
      flavour:
       - "Pew pew."
  wildfirefuel:
    base: wildfire_fuel
    name: Wildfire Fuel
    lore:
      description:
       - "Tuis Ammo for wildfire."
      flavour:
       - "Careful its hot!."

  compass:
    material: compass
    name: "&6&lTHE MIGHTY DWARVEN COMPASS"
    lore:
      description:
       - "Clicking cycles through various\n
          locations."
      flavour:
       - "&dUsed by only the greatest of warriors."


hero:
  tuihammer:
    template: dwarf-hero
    base: tui_hammer
    name: Kindled Light
    shiny: true
    lore:
      description:
       - "Right click to Roar!\n
          Attracting all AIs to you."
      flavour:
        - |-
          Rank 11? Psssh, that's nothing. When you've lived your whole
          life with the flames, the holy light is all you see. I've bathed
          in embers, emerged victorious from scorching coals. This
          hammer's been with me through it all.
    modifiers:
      attack: 25
      kb_resist: 1
  wildfire:
    template: dwarf-hero
    base: wildfire
    name: Wildfire
    lore:
      description:
       - "Right click to send out a stream\n
          of fire to harm mobs.\n
          Uses ammo."
      flavour:
       - "Begone foul demons of the night!"

  tinderflame:
    template: dwarf-hero
    base: tinderflame
    name: Not Tinderflame
    lore:
      description:
       - "Right click to shoot a beam\n
          at a mob dealing heavy damage\n
          and knocking you back."
      flavour:
       - "This thing cuts really good too.."
    modifiers:
      attack: 20
  wand:
    template: dwarf-hero
    base: magic_wand
    name: Wand of No Particular Reference
    lore:
      description:
       - "Right click to cast a\n
          Wormhole, pulling in all\n
          mobs near it."
      flavour:
       - "WOOORRMMMMHOOOLEEEE"
    modifiers:
      attack: 5
      kb_resist: 1

  pole:
    template: dwarf-hero
    material: stick
    name: Elystria
    lore:
      description:
       - "Right click to pull a dwarf\n
          to your location."
      flavour:
       - "Swoooosh."
    modifiers:
      attack: 15
      knockback: 2
  totem:
    template: dwarf-hero
    base: hammer
    name: Healer Totem Thingy
    lore:
      description:
       - "Temp"
      flavour:
       - "Temp"
    modifiers:
      attack: 10
      kb_resist: 1
  arthea-blade:
    template: dwarf-hero
    base: stick
    name: The blade thing
    lore:
      description:
       - "Temp"
      flavour:
       - "Temp"
    modifiers:
      attack: 60
      kb_resist: 1
    shiny: true


armour:
  high:
    chest: &default_chest
      material: diamond_chestplate
      name: Dwarven Chestplate
      lore:
        description:
         - "Fully repaired armour."
        flavour:
         - "Now get out there and fight!."
      modifiers:
        health: 10

    legs: &default_legs
      material: diamond_leggings
      name: Dwarven Leggings
      lore:
        description:
         - "Fully repaired armour."
        flavour:
         - "Now get out there and fight."

    boots: &default_boots
      material: diamond_boots
      name: Dwarven Boots
      lore:
        description:
         - "Fully repaired armour."
        flavour:
         - "Now get out there and fight."

  med:
    chest:
      <<: *default_chest
      material: iron_chestplate
    legs:
      <<: *default_legs
      material: iron_leggings
    boots:
      <<: *default_boots
      material: iron_boots

  low:
    chest:
      <<: *default_chest
      material: chainmail_chestplate
    legs:
      <<: *default_legs
      material: chainmail_leggings
    boots:
      <<: *default_boots
      material: chainmail_boots


