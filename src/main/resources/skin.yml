# ~~~ HOW TO ~~~
#
# To get skin data, first get the UUID of a player wearing that skin. This UUID can be found at:
# namemc.com/s/<PLAYER NAME>
#
# Get the id with no hyphens. Then put the id into the url below:
# https://sessionserver.mojang.com/session/minecraft/profile/<INSERT UUID HERE>?unsigned=false
#
# You'll get a bunch of text data. On the second line you'll see something like:
# [{"signature":"<LOTS OF RANDOM CHARACTERS>"
# Copy all of this into the sign section (note this often takes up multiple lines)
# Similarly, near the end, you'll see a "value":"<MORE RANDOM CHARS>"}]}
# Copy this into the skin section.