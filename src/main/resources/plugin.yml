main: deimophobe.nightfall.NightfallPlugin
name: Nightfall
version: 0.1
author: Deimophobe
description: The main plugin for the nightfall game.
depend: [ProtocolLib]
commands:
  setdwarf:
    usage: /setdwarf <name>  <item1 item2 ...>
    description: Sets a player to be a dwarf.
  sethero:
    usage: /sethero <name> <herotype>
    description: Sets a player to be a hero.
  setmob:
    usage: /setmob <name>
    description: Sets a player to be a mob
  spawnmob:
    usage: /spawnmob <name> <mobtype>
    description: Forces a player to spawn as a mob
  removeplayer:
    usage: /removeplayer <name>
    description: Removes a player (from both dwarf and mob).

  horn:
    usage: /horn
    description: HORN
  armour:
    usage: /armour [equip|amount] | /armour [damage|repair] <amount>
    description: Cheaty self-armour.
    aliases: armor
  damage:
    usage: /damage <amount> | /damage <player> <amount>
    description: Damage someone.
    aliases: dmg
  xp:
    usage: /xp <amount>
    description: Give yourself some mob xp.
    aliases: [exp, mana]
  giveitem:
    usage: /giveitem <item-name>
    description: Give a custom item to yourself.
  givearrow:
    usage: /givearrow [amount]
    description: Give arrows if you are a dwarf.
  mana:
    usage: /mana [amount]
    description: Give mana if you are a dwarf.
  hat:
    usage: /hat
    description: Lets kuude wear a fancy hat.

  trash:
    description: For deleting your duplicate items.
  chest:
    description: For sharing resources with your fellow dwarves.
  compass:
    description: Blesses Jimmy with the mighty dwarven compass.
  loadout:
    description: Choose a kit!
    aliases: kit
  stuck:
    description: For when you're stuck (before the game starts).
  explore:
    description: Teleport to the map (before the game starts).
  who:
    description: See who is online.
    aliases: list

  toggleais:
    description: Enables/disables AI spawning.
    usage: /toggleais
  toggledoom:
    description: Enables/disables doom clock.
    usage: /toggledoom
  spawnai:
    description: Spawns an AI at your location
    usage: /spawnai <amount>
    alias: aispawn

  ready:
    description: Before game start, use to alert the game that you are ready.
    usage: /ready
  readylist:
    description: List all ready players
    usage: /readylist
  forcestart:
    description: Forces the game to start.
    usage: /forcestart
  forceplague:
    description: Forces the plague to occur.
    usage: /forceplague <plague-type>
  plagueimmune:
    description: Makes a player (un)immune to plague.
    usage: /plagueimmune <player>
  plague:
    description: Makes yourself plague up to the limit.
    usage: /plague

  forcedoom:
    description: Forces the doom timer to hit 0.
    usage: /forcedoom
  summondoom:
    description: Summons the specific doom type. Does not affect doom clock.
    usage: /summondoom <doom type>

  map:
    description: Manage the map loading system.
    usage: /map [enable|disable|reload|list|clear|next] | /map [queue|play|load] <map>
  debug:
    description: Enable debug mode.
    usage: /debug

  fixplayers:
    usage: /fixplayers
    description: Might help show players if some are invisible.

  shrine:
    description: Damage or recover shrine power.
    usage: /shrine kill | /shrine [damage|recover] <amount (0-1000)>

  gold:
    description: Add (or remove) gold based on input number.
    usage: /gold <amount> | /gold [shrine|vault] <amount>
