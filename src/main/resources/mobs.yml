zombie:
  title: Zombie

  disguisetype: zombie

  attack: 10

  armour:
    material: rotten_flesh
    name: Tough Flesh
    lore:
      description:
       - "Hardened flesh of the undead\n
          making it as tough as armour."
      flavour:
       - "The harder they beat you down\n
          The stronger your hunger grows."
    bound: true
  weapon:
    material: wood_pickaxe
    name: Makeshift Pick
    lore:
      description:
       - "Left click to attack dwarves\n
          Shredding their armour and\n
          dealing damage.\n
          Right click to leap when\n
          you unlock the upgrade."
      flavour:
       - "A cross between a runeblade hilt and\n
          plank debris. The dead use anything of\n
          their fallen comrades."

gobo:
  title: Goblin

  disguisetype: creeper

  attack: 5

  armour:
    material: sulphur
    name: Explosive Flesh
    lore:
      description:
       - "Goblins Armour\n
          Keep away from TNT Crates."
      flavour:
       - "Kaaaaaaa."
    bound: true
  weapon:
    material: wood_pickaxe
    name: Gobo Pick
    lore:
      description:
       - "A weak weapon that is used\n
          for piercing armour."
      flavour:
       - "Hehehe Smashy Smashy."
  items:
    gobo-box:
      base: tnt
      name: Gobo Box
      lore:
        description:
         - "Left click to throw a box\n
            dealing damage to dwarves and\n
            nearby walls.\n
            &aRight click to place a box\n
            &aheavily damaging walls once\n
            &ait explodes&r."
        flavour:
         - "Gobos Primed and Ready."
    kaboom:
      base: kaboom
      name: KABOOM
      lore:
        description:
         - "Left click to prime yourself\n
            exploding after a few seconds\n
            and damaging walls, while sending\n
            dwarves flying."
        flavour:
         - "It's KAAAAAAAAABOOOM!"


flamelancer:
  title: Flamelancer

  disguisetype: skeleton

  attack: 0
  speed: 50

  arrowres: 0.5
  shred: 5

  armour:
    material: fireball
    name: Tough Flesh
    lore:
      description:
       - "Flamelancer Armour."
      flavour:
       - "It's pretty hot."
    bound: true
  weapon:
    base: flamebow
    name: Nether Tooth Bow
    lore:
      description:
       - "You unleash a volley of arrows on attack\n
          creating fire where they land\n
          The more you draw back the more arrows\n
          that fire."
      flavour:
       - "Conflaguration!"
  items:
    arrow:
      material: arrow
      name: Skeletal Arrow
      lore:
        description:
         - "A skeletons quiver of arrows."
        flavour:
         - "Pointy."


