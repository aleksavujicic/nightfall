zombie:
  title: Zombie

  disguisetype: zombie

  attack: 10

  armour:
    material: rotten_flesh
    name: Tough Flesh
    lore:
      description:
       - "Hardened flesh of the undead\n
          making it as tough as armour."
      flavour:
       - "The harder they beat you down\n
          The stronger your hunger grows."
    bound: true
  weapon:
    material: wood_pickaxe
    name: Makeshift Pick
    lore:
      description:
       - "Left click to attack dwarves, shredding\n
          their armour and dealing damage.\n
          Right click to leap with the upgrade."
      flavour:
       - "A cross between a runeblade hilt and\n
          plank debris. The dead use anything of\n
          their fallen comrades."

gobo:
  title: Goblin

  disguisetype: creeper

  attack: 5

  armour:
    material: sulphur
    name: Explosive Flesh
    lore:
      description:
       - "Keep away from TNT Crates."
      flavour:
       - "Kaaaaaaaaaaaaaa."
    bound: true
  weapon:
    material: wood_pickaxe
    name: Gobo Pick
    lore:
      description:
       - "A weak weapon that is used\n
          for piercing armour."
      flavour:
       - "Hehehehehehe."
  items:
    gobo-box:
      base: tnt
      name: Gobo Box
      lore:
        description:
         - "Left click to throw a box, dealing\n
            damage to dwarves and nearby walls.\n
            &aRight click to place boxes, which\n
            &aheavily damage walls once they explode&r."
        flavour:
         - "Gobos Primed and Ready."
    kaboom:
      base: kaboom
      name: KABOOM
      lore:
        description:
         - "Left click to prime yourself, creating a\n
            large explosion around you in a few seconds."
        flavour:
         - "It's KAAAAAAAAABOOOM!"


flamelancer:
  title: Flamelancer

  disguisetype: skeleton

  attack: 0
  speed: 50

  arrowres: 0.5
  shred: 5

  armour:
