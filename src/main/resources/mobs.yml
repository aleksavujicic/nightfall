          The more the bow is drawn back, \n
          the more arrows that fire."
      flavour:
       - "Conflagration!"
  items:
    arrow:
      material: arrow
      name: Skeletal Arrow
      lore:
        description:
         - "A skeleton's quiver of arrows."
        flavour:
         - "Pointy."


