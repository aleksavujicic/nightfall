items:
  reset-page:
    template: monster-simple
    base: menu.trash
    name: Reset Upgrades

  reset-xp:
    base: menu.trash
    name: Confirm Reset
    lore:
      description:
       - "You have currently spent\n
          $xp exp on your upgrades.\n
          Confirm to reseet all of your\n
          upgrades and get $refund xp back."

  back:
    template: monster-simple
    base: menu.left-arrow
    name: Go Back

  cancel:
    template: monster-simple
    base: menu.cancel
    name: Cancel Reset

  rebirth:
    template: monster-egg
    material: ender_eye
    name: Rebirth
    lore:
      description:
       - "Respawn where you died."



upgradeable-mobs:
  zombie-fury:
    index: 10
    spawn-item:
      material: wooden_pickaxe
      name: "Spawn Fury Zombie"
      lore:
        description:
          - "Test"
    has-rebirth: true

    cost: 3000
    upgrade-item:
      material: ender_eye
      name: "Select Fury Zombie"
      lore:
        description:
          - "Become a Fury Zombie.\n
             An offensively oriented zombie\n
             that can quickly damage and\n
             break armour."


