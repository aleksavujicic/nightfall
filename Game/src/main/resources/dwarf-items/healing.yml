healing:
  base: healing-ale
  name: Healing Ale
  shiny: true
  lore:
    description:
     - "Left click to heal yourself for &b$manacost&r mana."
    flavour:
     - "\"Less fancier than the stars, but still nifty.\" - Arthea"

safety:
  base: safety-juice
  name: Safety Juice
  shiny: true
  lore:
    description:
     - "The starting ale for new players.\n
        Auto heal for &b$autocost&r mana or\n
        Left click to heal for &b$manacost&r mana."
    flavour:
     - "\"I'm just glad that you &ocan&r drink your juice.\" - Velvetine"

hearty:
  base: hearty-ale
  name: Hearty Ale
  shiny: true
  lore:
    description:
     - "Left click to heal yourself for &b100&r mana.\n
        Has passive &b$hearts&r extra hearts. Also gives\n
        &e40% resistance&r for &b4&r seconds."
    flavour:
     - "\"This is the good stuff, better than\n
          the regular ales!\" - Tui"

pendant:
  base: pendant
  name: Ruby Pendant
  lore:
    description:
     - "Left click to heal yourself\n
        for &b$manacost&r mana and gain\n
        &bResistance II&r and stronger &bRegen&r for 3 seconds.\n
        Has passive &bregeneration&r."
    flavour:
     - "\"Drink your... Gem? How do you use this thing?\" - Velvetine"
     - "\"It’s a regem! Hah! Get it!?\" - Tui"

regrowth:
  base: regrowth
  name: Regrowth Star
  lore:
    description:
     - "Left click to heal yourself\n
        for &b100&r mana.\n
        Right click on dwarves to heal\n
        them and their armour for &b20&r mana."
    flavour:
     - "\"For those who want others to live another night.\" - Arthea"

chug:
  base: chugging-ale
  name: Chugging Ale
  shiny: true
  lore:
    description:
     - "Left click to heal for &b6&r hearts.\n 
        Uses &b$manacost&r mana. You are able to spam\n
        this as much as you want\n
        so be careful and watch your mana!\n
        You also gain &espeed&r for &b1&r second\n
        each sip."
    flavour:
     - "\"One of Potion Seller's experimental potions. Use with care.\" "

strong:
  base: strong-ale
  name: Potion Seller's Strongest Potion
  shiny: true
  lore:
    description:
     - "A very strong potion, which gives\n
        you &e60% resistance&r making you feel like\n
        a hero. However, it uses &b250&r mana."
    flavour:
     - "\"My potions are too strong for you\n
          traveller.\" - Potion Seller"

shield:
  base: shield-ale
  name: Temp Name
  shiny: true
  lore:
    description:
     - "Temp"
    flavour:
     - "Temp"