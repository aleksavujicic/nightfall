shortbow:
  base: shortbow
  name: Shortbow
  lore:
    description:
     - "A bow made with oak wood and\n
        hempen rope."
    flavour:
     - "\"Don't insult it, I've used this thing plenty of times.\" - Velvetine"

dragonskin:
  base: phoenix-bow
  name: Phoenix Bow
  lore:
    description:
     - "Left click to enable &bPower Shot Mode&r.\n
        Power shots do &b200&r power damage that\n
        pierces half of target arrow resistance\n
        and gives a &b5&r second proc on kill.\n
        Cooldown of &e30s&r."
    flavour:
     - "\"Feel the PROC pulsing through your bow.\" - Velvetine"

longbow:
  base: longbow
  name: Longbow
  lore:
    description:
     - "Killing mobs will increase the longbow's\n
        power by &b10&r per kill, up to a maximum\n
        of &b125&r power.\n
        Must kill a mob every &e6 seconds&r to\n
        maintain this bonus."
    flavour:
     - "\"Aim for the wolves!\" - Velvetine"

crossbow:
  base: crossbow
  name: Crossbow
  lore:
    description:
     - "A crossbow that can fire with no draw time.\n
          Left click to rapid fire, using all your quiver.\n
          Uses two arrows for the normal shot and has a\n
          slight reload time."
    flavour:
     - "\"What do you mean these take skill to use?\" - Arthea"

lightbow:
  base: lightbow
  name: Lightbow
  lore:
    description:
     - "This bow fires special arrows that\n
        create lamps in the walls, as well as\n
        mark mobs that are hit.\n
        You are also immune to darkness."
    flavour:
     - "\"Hey can I get some light? Thanks.\" - Tui"

jadebow:
  base: jade-bow
  name: Jade Bow
  lore:
    description:
     - "A magical bow, made from jade.\n
        Shooting other dwarves gives them\n
        a short duration proc. Cost 2 arrows."
    flavour:
     - "I'm sure glad we found use\n
        for the rest of that Jade City."

warpweaver:
  base: warpweaver
  name: Warpweaver Bow
  lore:
    description:
     - "Left click to activate effect.\n
        When activated, you will teleport\n
        to where the arrow lands.\n
        Getting hit will cancel the teleport.\n
        Has a 30 second cooldown."
    flavour:
     - "\"Hey look at this thing! Isn't it cool!?\" - Tui"

turret:
  material: dispenser
  name: Turret
  lore:
    description:
     - "A turret that fires arrows.\n
        Can be rotated."
    flavour:
     - "\"It still needs some work.\" - Nosovin"

volcanic:
  base: volcanic
  name: Volcanic Gauntlet
  lore:
    description:
     - "Charge up a lined blast of fire\n
        that pierces everything in\n
        its path. Uses 2 arrows a shot."
    flavour:
     - "\"This gauntlet can even burn hellhounds.\" -Tui"
  modifiers:
    attack: 15

spellbook:
  base: spellbook
  name: Magical Spellbook
  lore:
    description:
     - "&DMagic Missile&r &3L+L&r &C(3 essence)&r\n
        Fires 3 Missiles in front of you.\n
        &DLevitate&r &3R+R&r &C(10 essence)&r\n
        Lifts you in the air for a few seconds.\n
        &DSoul Stream&r &3L+R&r &C(6 essence)&r\n
        Fires a multihit beam infront of you.\n
        &DBolster&r &3R+L&r &C(20 essence)&r\n
        Gives Yourself/Allies within 6 blocks, 6 hearts."
    flavour:
     - "\"The balanced path is hardly ever the\n
        most entertaining.\" - The Grand Magus"
     - "\"Words from the ancients. Who was here before us?\" - Velvetine"
     - "\"Hah, reading is for nerds!\" - Tui"
     - "\"Don't try speaking that mumbo jumbo to me!\" - Arthea"

essence:
  base: essence
  name: Essence
  lore:
    description:
     - "Magical essence used\n
        for casting spells."
    flavour:
     - "Essence Ammo."