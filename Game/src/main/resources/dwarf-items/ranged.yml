shortbow:
  base: shortbow
  name: Shortbow
  lore:
    description:
     - "A bow made with oak wood and\n
        hempen rope."
    flavour:
     - "\"Don't insult it, I've used this thing plenty of times.\" - Velvetine"

dragonskin:
  base: phoenix-bow
  name: Phoenix Bow
  lore:
    description:
     - "Left click to enable &bPower Shot Mode&r.\n
        Power shots do &b200&r power damage that\n
        pierces half of target arrow resistance\n
        and gives a &b5&r second proc on kill.\n
        Cooldown of &e30s&r."
    flavour:
     - "\"Feel the PROC pulsing through your bow.\" - Velvetine"

longbow:
  base: longbow
  name: Longbow
  lore:
    description:
       - "Shooting player controlled mobs\n
          temporarily increases bow power by &b20&r,\n
          for a max of &b200&r power for &e10 seconds&r.\n
          Shooting AI controlled mobs lengthens\n
          the increase time by &e2 seconds&r."
    flavour:
     - "\"Aim for the wolves!\" - Velvetine"

crossbow:
  base: crossbow
  name: Crossbow
  lore:
    description:
     - "A crossbow that can fire with\n
          no draw time.\n
          Uses two arrows and has a\n
          slight reload time."
    flavour:
     - "\"What do you mean these take skill to use?\" - Arthea"

lightbow:
  base: lightbow
  name: Lightbow
  lore:
    description:
     - "This bow fires special arrows that\n
        create lamps in the walls.\n
        Pierces half of target arrow resistance.\n
        You are also immune to darkness."
    flavour:
     - "\"Hey can I get some light? Thanks.\" - Tui"

jadebow:
  base: jade-bow
  name: Jade Bow
  lore:
    description:
     - "A magical bow, made from jade.\n
        Shooting other dwarves gives them\n
        a short duration proc. Cost 2 arrows."
    flavour:
     - "I'm sure glad we found use\n
        for the rest of that Jade City."

warpweaver:
  base: warpweaver
  name: Warpweaver Bow
  lore:
    description:
     - "Left click to activate effect.\n
        When activated, you will teleport\n
        to where the arrow lands.\n
        Getting hit will cancel the teleport.\n
        Has a 30 second cooldown."
    flavour:
     - "\"Hey look at this thing! Isn't it cool!?\" - Tui"

turret:
  material: dispenser
  name: Turret
  lore:
    description:
     - "A turret that fires arrows."
    flavour:
     - "\"It still needs some work.\" - Nosovin"

volcanic:
  base: volcanic
  name: Volcanic Gauntlet
  lore:
    description:
     - "Charge up a lined blast of fire\n
        that pierces everything in\n
        its path. Uses 3 arrows a shot."
    flavour:
     - "\"This gauntlet can even burn hellhounds.\" -Tui"
  modifiers:
    attack: 15

spellbook:
  base: spellbook
  name: Magical Spellbook
  lore:
    description:
     - "Magic."
    flavour:
     - "\"The balanced path is hardly ever the\n
        most entertaining.\" - The Grand Magus"

essence:
  base: essence
  name: Essence
  lore:
    description:
     - "Magical essence used\n
        for casting spells."
    flavour:
     - "Flavour text here"