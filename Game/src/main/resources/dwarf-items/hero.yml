##### TUI #####
tuihammer:
  base: tui-hammer
  name: Kindled Light
  shiny: true
  lore:
    description:
     - "Right click to Roar, giving a proc and\n
        attracting all AIs to you."
    flavour:
      - |-
        Rank 11? Psssh, that's nothing. When you've lived your whole
        life with the flames, the holy light is all you see. I've bathed
        in embers, emerged victorious from scorching coals. This
        hammer's been with me through it all.
  modifiers:
    attack: 25
    kb-resist: 100

wildfire:
  base: wildfire
  name: Wildfire
  lore:
    description:
     - "Right click to send out a stream\n
        of fire to harm mobs.\n
        Uses ammo."
    flavour:
     - "Begone foul demons of the night!"

wildfirefuel:
  base: fireball
  name: Wildfire Fuel
  lore:
    description:
     - "Tui's Ammo for wildfire."
    flavour:
     - "Careful, its hot."


##### NOSOVIN #####
tinderflame:
  base: tinderflame
  name: Not Tinderflame
  lore:
    description:
     - "Right click to shoot a beam\n
        at a mob dealing heavy damage\n
        and knocking you back."
    flavour:
     - "This thing cuts really well too."
  modifiers:
    attack: 20

wand:
  base: wand
  name: Wand of No Particular Reference
  lore:
    description:
     - "Right click to cast a\n
        Wormhole, pulling in all\n
        mobs near it."
    flavour:
     - "WOOORRMMMMHOOOLEEEE"
  modifiers:
    attack: 5
    kb-resist: 80


##### ARTHEA #####
caduceus:
  base: arthea-weapon
  name: Caduceus
  lore:
    description:
     - "Right click to pull a dwarf\n
        to your location."
    flavour:
     - "Swoooosh."
  modifiers:
    attack: 20
    knockback: 2
    kb-resist: 80

totem:
  base: arthea-heal
  name: Asclepius
  lore:
    description:
     - "Right click to heal and buff dwarves\n
        at the cost of your own mana.\n
        Left click to summon a giant arcane mark."
    flavour:
     - "Illuminate!"

luminous:
  base: luminous
  name: "Luminous"
  lore:
    description:
     - "Shoots a powerful beam of light,\n
        which gives procs to dwarves and\n
        pierces 50% arrow resistance."
    flavour:
     - "\"Forward, dwarves! Let the light guide you.\" - Arthea"

elystria:
  base: elystria
  name: Elystria The Divine Blade
  lore:
    description:
     - "One of the Twin legendary runeswords.\n
        Holds mastery over Life & Death.\n
        Go on an immortal rampage for 60 seconds."
    flavour:
     - "Eternal Rest."
  modifiers:
    attack: 60
    kb-resist: 100
  shiny: true


##### VELVETINE #####
velsword:
  base: vel-sword
  name: "Nyneve"
  lore:
    description:
     - "One of the legendary runeswords.\n
        Holds mastery of the wind and earth.\n
        10 second cooldown on runedashes."
    flavour:
     - "\"It was there, glowing in the lake.\" - Velvetine"
  modifiers:
    attack: 25
    kb-resist: 80
  shiny: true

velbow:
  base: vel-bow
  name: "Pyrrhic"
  lore:
    description:
     - "The Power Shot proc of this bow lasts for 5 seconds\n
        and sends the target flying."
    flavour:
     - "\"Feel the PROC pulsing through your bow.\" - Velvetine"

horn:
  base: horn
  name: Horn
  lore:
    description:
     - "Left click to send every dwarf\n
        into a powerful rampage!"
    flavour:
     - "Vroooooom!"


##### HERANA #####
trident:
  base: trident
  name: Trident of Naia
  lore:
    description:
     - "Right click to create a puddle of water,\n
        then left click to freeze it\n
        trapping anything inside."
    flavour:
     - "\"The sky darkens...\" -Ancient Tome"
  modifiers:
    kb-resist: 100

bubblebeam:
  base: bubble-beam
  name: Bubble Beam
  lore:
    description:
     - "Left click to shoot a wave of bubbles\n
        at a single target.\n
        Right click to summon the Whirlpool\n
        pulling in mobs, and allowing dwarves to\n
        float on the top of it."
    flavour:
     - "\"...and the oceans rumbled.\" - Ancient Tome"

heranabow:
  base: herana-bow
  name: Herana's Bow
  lore:
    description:
     - "Fully charged shots from this bow, cause an\n
        Area of effect attack where the arrow lands."
    flavour:
     - "\"The Queen resurfaces.\" - Ancient Tome"


##### LYRA #####
claw:
  base: silvetris-claw
  name: Claw
  lore:
    description:
     - "Right click to leap forward\n
        using your cat-like reflexes."
    flavour:
     - "\"Sharpened to purrfection.\" -Lyra"
  modifiers:
    attack: 25


