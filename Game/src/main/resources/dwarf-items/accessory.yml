compass:
  material: compass
  name: "Trusty Compass"
  lore:
    description:
     - "Left click to see current location.\n
        Right click to cycle through various\n
        locations on the map."
    flavour:
     - "A simple but useful tool."

chesto:
  base: chestomatic
  name: "Chest-o-matic"
  lore:
    description:
     - "Click to access the shared resource chest."
    flavour:
     - "Sharing is caring."

bricklayer:
  base: bricklayer
  name: "Bricklayer"
  lore:
    description:
     - "This tool can be used to automatically build walls.\n
        Left click to select your first corner, shift left\n
        click to select the second. You can then right click\n
        to start filling in a wall between these blocks.\n
        This will consume cobblestone from your inventory.\n
        You may pause/resume the building with another\n
        right click."
    flavour:
     - "\"Remember the magic runs out at night!.\"- Nosovin"

clock:
  base: clock
  name: "Gnomish Clock"
  lore:
    description:
     - "Right click to get the\n
        current time."
    flavour:
     - "A simple but useful tool."

tombmaker:
  base: tombmaker
  name: Tombmaker
  lore:
    description:
     - "Allows you to dig faster and be more\n
        likely to find items in gravel."
    flavour:
     - "\"I used to dig graves with these things. It's insane.\" - Tui"
     - "\"Two in the grave, two for the banshees.\" - Velvetine"
  modifiers:
    attack: 8

aegis:
  base: aegis
  name: Enchanted Aegis
  lore:
    description:
     - "Right click to give yourself 5 shields.\n
        Can be used once every 180 seconds."
    flavour:
     - ""
  modifiers:
    resistance: 20

penystick:
  material: blaze_rod
  name: "Penny Stick"
  lore:
    description:
     - "Penny"
    flavour:
     - "She is more popular"

procshovel:
  base: procshovel
  name: "Ancient Dwarven Shovel"
  lore:
    description:
     - "This shovel can roll procs."
    flavour:
     - "Blame Capt."
  modifiers:
     attack: 3
     knockback: 2