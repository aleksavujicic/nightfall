lamp:
  base: lamp
  name: Enchanted Lamp
  lore:
    description:
     - "Places a lamp down for &b60&r seconds."
    flavour:
     - "\"These aren't shiny; why are they called enchanted?\" - Velvetine"

slab:
  base: slab
  name: EZ Fix Slab
  lore:
    description:
     - "Left click to summon a thick wall."
    flavour:
     - "\"Slab! And a slab! And another slab!\" - Tui"

charm:
  base: charm
  name: Consecrating Charm
  lore:
    description:
     - "Left click to call upon the mighty swords\n
        freezing mobs caught inside its area,\n
        and allowing you to finish them off."
    flavour:
     - "\"Better make them worthwhile, jimmy.\" - Velvetine"

wrench:
  base: wrench
  name: Wrench
  lore:
    description:
     - "Left click to fully repair your\n
        dwarven armour at the cost of gold.\n
        Needs 50 gold to work."
    flavour:
     - "\"Who needs teamwork when you got these?\" - Tui"

mortar:
  base: mortar
  name: Mortar
  lore:
    description:
     - "Left click to repair walls to their\n
        max level during build phase.\n
        Makes grey walls after mobs are released."
    flavour:
     - "Blue the walls dwarves."

wizard-mortar:
  base: wizard-mortar
  name: Wizard Mortar
  lore:
    description:
     - "Left click to fully repair walls to blue.\n
        Only works after mobs are released."
    flavour:
     - "Don't ask what makes it blue."

forged-armour:
  base: forged-armour
  name: Dwarven Armour
  lore:
    description:
     - "Left click to armour a dwarf."
    flavour:
     - "Make sure every dwarf gets one."

healing-station:
  base: healing-station
  name: Healing Station
  lore:
    description:
     - "Left click to place down a\n
        healing totem that gives an\n
        AoE &4Regen&r buff."
    flavour:
     - "\"Kinda like being a healer, but requires less work.\" - Arthea"

proc-bottle:
  base: proc-bottle
  name: Proc in a Bottle
  lore:
    description:
     - "Proc"
    flavour:
     - "\"Chug! Chug! Chug! Chug!\" - Tui"
     - "\"Brings energy to your veins, and strength to your heart.\" - Velvetine"
     - "\"For the love of gods don’t get addicted on these!”\" - Arthea"

turret:
  base: turret
  name: Turret
  lore:
    description:
     - "Rotatable block that shoots\n
        a constant stream of arrows"
    flavour:
     - "\"Built by our finest engineers.\" - Velvetine"
     - "\"You're lucky these don't have friendly fire!\" - Arthea"

jump-pad:
  base: temp
  name: Jump Pad
  lore:
    description:
     - "Jump"
    flavour:
     - "Flavour"

spare-quiver:
  base: temp
  name: Spare Quiver
  lore:
    description:
     - "Restocks Arrows"
    flavour:
     - "Flavour"


log:
  base: logs
  name: Wooden Log
  lore:
    description:
     - "Right click on a saw to turn\n
        into wooden planks."
    flavour:
     - "Wood from a mighty oak tree."

plank:
  base: planks
  name: Wooden Plank
  lore:
    description:
     - "Right click on a saw to turn\n
        into sticks."
    flavour:
     - "Planks from a mighty oak tree."

stick:
  material: stick
  name: Stick
  lore:
    description:
     - "Right click on a saw to turn\n
        into bowls.\n
        Right click on oil to turn\n
        into a torch."
    flavour:
     - "A stick. Looks like a stick."

bowl:
  material: bowl
  name: Wooden Bowl
  lore:
    description:
     - "Right click on oil to turn\n
        into mortar."
    flavour:
     - "It's a large bowl, could hold mortar."

torch:
  material: torch
  name: Torch
  lore:
    description:
     - "Hold a torch in your hand\n
        makes you immune to darkness."
    flavour:
     - "Keeps the darkness away."

cobble:
  material: cobblestone
  name: Cobblestone
  lore:
    description:
     - "Mined from gravel, turns into Bricks\n
        when mortared."
    flavour:
     - "It's stone."

sand-grain:
  material: gold_nugget
  name: Grain of Sand
  lore:
    description:
     - "Can be turned into glass by right\n
        clicking on a furnace."
    flavour:
     - "It's smol."

glass:
  material: glass
  name: Blast-Proof Glass
  lore:
    description:
     - "Left click to change colour."
    flavour:
     - "It's transparent. And blast proof."