# To disable loading maps set this to false. This will use the
# main world instead.
# Defaults to false.
enabled: true

# Set to true to have a new map loaded once the game has ended.
# Defaults to true.
auto-cycle: true
# Time (in seconds) after game end that a new map will be loaded.
# Defaults to 30 seconds
cycle-time: 30

# List of maps that can be loaded.
# The key is the map name, with folder
# and rotation specified.
maps:
  nurah:
    folder: Nurah
    rotation: disabled
  machine:
    folder: MyMachine
    rotation: main
  mermaid:
    folder: mermaid
    rotation: main
  tiger:
    folder: flat
    rotation: testing
  space:
    folder: Penny-Space
    rotation: disabled
  space2:
    folder: space
    rotation: disabled