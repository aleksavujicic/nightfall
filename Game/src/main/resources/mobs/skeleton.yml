base:
  title: Skeleton

  health: 10
  attack: 0

  proccable: true
  resistance: 0.6
  shred: 0

  disguisetype: skeleton
  armour:
    material: bone
    name: Tough Bones
    lore:
      description:
       - "The bones of an undead,\n
          reanimated by dark magic."
    bound: true
  weapon:
    base: shortbow
    name: Skeletal Bow
    lore:
      description:
       - "Hold right click to fire an arrow.\n"
      flavour:
       - "An old bow wielded by the dead."
  items:
    arrow:
      material: arrow
      name: Skeletal Arrow
      lore:
        description:
         - "A skeleton's quiver of arrows."
        flavour:
         - "The cursed arrows of undead skeletons,\n
            capable of piercing even runeblessed armour."

wither:
  parent: base
  title: Wither
  disguisetype: wither_skeleton
  weapon:
    base: skeleton.wither-bow
    name: Nether Tooth Bow
    lore:
      description:
       - "Shots shred armour and damage dwarves,\n
          becoming more powerful every consecutive hit."
      flavour:
       - "Imbued with the darkest curses,\n
          any armour hit will decay and rot."

flamelancer:
  parent: base
  title: Flamelancer
  weapon:
    base: skeleton.flame-bow
    name: Nether Tooth Bow
    lore:
      description:
       - "Your arrows are set on fire,\n
          and with upgrades you can fire volleys."
      flavour:
       - "Forged in the fiery nether,\n
          all arrows fired burst into flames."
  items:
    blaze:
      base: temp
      name: Blaze Runner
      lore:
        description:
         - "Fire"
        flavour:
         - ""

impact:
  parent: base
  title: Impact Skeleton
  weapon:
    base: skeleton.impact-bow
    name: Strong Bow
    lore:
      description:
       - "Your arrows knock dwarves away."
      flavour:
       - "The heavy arrows fired by this bow\n
          can knock away dwarves."
  items:
    stick:
      material: stick
      name: Punting Stick
      lore:
        description:
         - "Punch those dwarves away."
        flavour:
         - "Punching dwarves, punching dwarves."
