base:
  title: Zombie

  disguisetype: zombie

  attack: 10

  armour:
    base: zombie.hide
    name: Tough Flesh
    lore:
      description:
       - "Hardened flesh of the undead\n
          making it as tough as armour."
      flavour:
       - "The harder they beat you down\n
          The stronger your hunger grows."
    bound: true
  weapon:
    base: zombie.sword
    name: Makeshift Sword
    lore:
      description:
       - "Left click to attack dwarves, shredding\n
          their armour and dealing damage.\n"
      flavour:
       - "A cross between a runesword hilt and\n
          plank debris. The dead use anything of\n
          their fallen comrades."


husk:
  parent: base

  title: Husk

  disguisetype: husk

fury:
  parent: base

  title: Fury Zombie

saboteur:
  parent: base

  title: Saboteur

  disguisetype: zombie_villager

  attack: 5

  items:
    wood-pickaxe:
      base: zombie.pick
      name: Makeshift Pick
      lore:
        description:
        - "Break through defenses with this pick.\n
           Right click to become invisible."
        flavour:
        - "A saboteur's tool,\n
           made to sneak through defenses"
      modifiers:
        can-dig: 1
    unhide:
      material: feather
      name: Unhide
      lore:
        description:
        - "Click to unhide."
        flavour:
        - ""
    vines:
      material: vine
      name: Vines
      lore:
        description:
        - "Right click place vines."
        flavour:
        - ""

  sounds:
    assassinate:
      path: "entity.wither.shoot"
      pitch: 2
    laugh:
      path: "mob.gobo.action"
      pitch: 1.5
    sabotage:
      path: "block.anvil.land"
      pitch: 1.25