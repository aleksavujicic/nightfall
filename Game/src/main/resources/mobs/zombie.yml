base:
  title: Zombie

  disguisetype: zombie

  attack: 10
  shred: 5
  health: 20

  armour:
    base: zombie.hide
    name: Tough Flesh
    lore:
      description:
       - "Hardened flesh of the undead\n
          making it as tough as armour."
      flavour:
       - "The harder they beat you down\n
          The stronger your hunger grows."
    bound: true
  weapon:
    base: zombie.sword
    name: Makeshift Sword
    lore:
      description:
       - "Left click to attack dwarves, shredding\n
          their armour and dealing damage.\n"
      flavour:
       - "A cross between a runesword hilt and\n
          plank debris. The dead use anything of\n
          their fallen comrades."
  sounds:
    death:
      path: "entity.zombie.death"
      pitch: 1

husk:
  parent: base

  title: Husk

  disguisetype: husk

  attack: 10
  health: 30
  shred: 10
  speed: -25

  sounds:
    death:
      path: "entity.husk.death"
      pitch: 1

fury:
  parent: base

  title: Fury Zombie

  attack: 15
  health: 20
  shred: 15


saboteur:
  parent: base

  title: Saboteur

  disguisetype: zombie_villager

  attack: 10
  health: 15
  shred: 5
  speed: 20

  weapon:
    base: zombie.sword
    name: Makeshift Sword
    lore:
      description:
       - "Left click to attack dwarves, shredding\n
          their armour and dealing damage.\n
          Right click to go invisible for a short time.\n
          Attacking while invisible will trigger a\n
          sneak attack, dealing bonus damage."
      flavour:
       - "A cross between a runesword hilt and\n
          plank debris. The dead use anything of\n
          their fallen comrades."
  items:
    pickaxe:
      base: zombie.pick
      name: Makeshift Pick
      lore:
        description:
        - "Break through defenses with this pick.\n
           Right click to become invisible."
        flavour:
        - "A saboteur's tool,\n
           made to sneak through defenses"
    unhide:
      material: feather
      name: Unhide
      lore:
        description:
        - "Click to unhide."
        flavour:
        - ""
    vines:
      material: vine
      name: Vines
      lore:
        description:
        - "Right click place vines."
        flavour:
        - ""

  sounds:
    assassinate:
      path: "entity.wither.shoot"
      pitch: 2
    laugh:
      path: "mob.gobo.action"
      pitch: 1.5
    sabotage:
      path: "item.shield.break"
      pitch: 0.85
    death:
      path: "entity.zombie.death"
      pitch: 1.25