base:
  title: Ogre Magi
  forcetitle: true

  disguisetype: player
  skin: magi-fire

  attack: 40
  health: 70
  shred: 30

  proccable: false
  resistance: 0.9
  arrowres: 0.5
  charmtime: 60
  shrine-prot-damage: 400
  depthstrider: 1

  armourslot: head
  armour:
    template: monster-hero
    base: hat.bone-crown
    name: Magi Headgear
    lore:
      description:
       - "Magi Headdress"
      flavour:
       - "We may need a better texture for this"
    modifiers:
      kb-resist: 100

  sounds:
    death:
      path: "entity.illusion_illager.death"
      pitch: 0.5

fire:
  parent: magi

  skin: magi-fire

  weapon:
    template: monster-hero
    base: magi.staff
    name: "Fire Magi Staff"
    lore:
      description:
       - "Right click to set everything on fire."
      flavour:
       - "Iz gud rod, make burn."
    modifiers:
      burning: 3
      knockback: 1

  sounds:
    bat-idle:
      path: "block.lava.pop"
      pitch: 1

ice:
  parent: magi

  skin: magi-ice

  speed: -15

  weapon:
    template: monster-hero
    base: magi.staff
    name: "Ice Magi Staff"
    lore:
      description:
       - "Right click to freeze things."
      flavour:
       - "If dwarf not move, it easy punchy thing. "
    modifiers:
      knockback: 1

  sounds:
    punch-ice:
      path: "block.note_block.chime"
      pitch: 1.5

thunder:
  parent: magi

  skin: magi-thunder

  speed: 10

  weapon:
    template: monster-hero
    base: magi.staff
    name: "Thunder Magi Staff"
    lore:
      description:
       - "Right click to strike\n
          the ground with thunder."
      flavour:
       - "Zap you Zap me."
    modifiers:
      knockback: 2

  sounds:
    punch:
      path: "block.note_block.chime"
      pitch: 1.5
    thunder-start:
      path: "entity.lightning_bolt.thunder"
      pitch: 1
    thunder-end:
      path: "entity.lightning_bolt.thunder"
      pitch: 1.5