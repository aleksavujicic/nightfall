sabotage:
  index: 10
  cost: [200, 400, 600, 800, 1000]
  values:
    armour: [10, 20, 30, 40, 50]
    value: [10, 20, 30, 40, 50]
  item:
    material: prismarine_shard
    name: "Sabotage"
    lore:
      description:
        - "Your sneak attack will do a bonus\n
           $armour armour damage. Additionally,\n
           your target will take $value% extra\n
           armour damage for 10 seconds."


poison:
  index: 11
  cost: [200, 400, 600, 800, 1000]
  values:
    duration: [8, 8, 8, 8, 8]
  item:
    base: potion-poison
    name: "Poisoned Strike"
    lore:
      description:
        - "Your sneak attack will inflict\n
           poison for $duration seconds. Additional\n
           upgrades will improve the potency\n
           of the poison."


stealth:
  index: 12
  cost: [100, 200, 300, 400, 500]
  values:
    invisibility: [3, 3.5, 4, 4.5, 5]
    cooldown: [19, 16, 17, 16, 15]
  item:
    material: sugar
    name: "Sneak Attack"
    lore:
      description:
        - "Increases the invisibilty duration\n
           of your sneak ability to $invisibility seconds.\n
           The cooldown of your sneak attack is\n
           reduced to $cooldown seconds."

