pick:
  index: 14
  cost: [1000, 2000]
  item:
    material: wooden_pickaxe
    name: "Sabotaging Pickaxe"
    lore:
      description:
        - "Turns your weapon into a pickaxe\n
           which can be used to destroy walls.\n
           Further upgrades give efficiency."


epinephrine:
  index: 15
  cost: [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000]
  values:
    value: [3, 6, 9, 12, 15, 18, 21, 24, 27, 30]
  item:
    material: glowstone_dust
    name: "Epinephrine"
    lore:
      description:
        - "Increases your base speed\n
           by $value%."


vines:
  index: 16
  cost: [200, 400, 600, 800, 1000]
  values:
    value: [2, 4, 6, 8, 10]
    duration: [40, 60, 80, 100, 120]
  item:
    material: vine
    name: "Vines"
    lore:
      description:
        - "Gives $value vines that can be\n
           used to get over walls. Each\n
           vine lasts for $duration seconds."


assassination:
  index: 22
  cost: 5000
  values:
    value: [50]
  prereq:
    sabotage: 5
    poison: 5
    stealth: 5
    pick: 2
    epinephrine: 10
    vines: 5
  item:
    material: iron_sword
    name: "Assassination"
    shiny: true
    lore:
      description:
        - "When invisible, the next hit\n
           will do $value additional damage."


speed-inf:
  index: 4
  cost: 2000
  permanent: true
  prereq:
    assassination: 1
  item:
    material: glowstone_dust
    name: "Upgrade Speed (inf)"
    shiny: true
    lore:
      description:
        - "Increases speed by 3%."