##############################
# SABOTEUR SUBCLASS UPGRADES #
##############################

sabotage:
  index: 10
  cost: [200, 400, 600, 800, 1000]
  value: [4, 8, 12, 16, 20]
  prereq:
    saboteur: 1
  item:
    material: prismarine_shard
    name: "Sabotage"
    lore:
      description:
        - "Temporarily damage dwarven armour\n
           each hit, causing it to take $value%\n
           more damage and armour damage\n
           for 5 seconds. Can only be used\n
           when invisible."


poison:
  index: 11
  cost: [200, 400, 600, 800, 1000]
  prereq:
    saboteur: 1
  item:
    base: potion-poison
    name: "Poisoned hit"
    lore:
      description:
        - "Poison dwarves with each hit.\n
           Upgrades improve poison level, with\n
           10 damage and 5 armor shred per level\n
           over 2 seconds."


sneak:
  index: 12
  cost: [100, 200, 300, 400, 500]
  prereq:
    saboteur: 1
  item:
    material: sugar
    name: "Sneak"
    lore:
      description:
        - "Right click to create a smoke screen\n
           and disappear into the shadows.\n
           Taking or dealing damage and breaking blocks\n
           will negate your invisibility.\n
           Available without upgrades every\n
           30 seconds, and higher levels decrease\n
           the cooldown up to 5 seconds."


pick:
  index: 14
  cost: [1000, 2000]
  prereq:
    saboteur: 1
  item:
    material: wood_pickaxe
    name: "Sabotage pick"
    lore:
      description:
        - "Destroy walls with this pick.\n
           Level 2 gives efficiency for the pick."


epinephrine:
  index: 15
  cost: [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000]
  value: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
  prereq:
