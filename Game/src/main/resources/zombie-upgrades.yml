  item:
    material: glowstone_dust
    name: "Epinephrine"
    lore:
      description:
        - "Increases speed by $value%."


vines:
  index: 16
  cost: [200, 400, 600, 800, 1000]
  value: [3, 6, 9, 12, 15]
  prereq:
    saboteur: 1
  item:
    material: vine
    name: "Vines"
    lore:
      description:
        - "Gives $value vines to place that last for a few minutes.\n
           Upgrades can also increase height of placed vines."


assassination:
  index: 22
  cost: 5000
  prereq:
    attack: 5
    health: 5
