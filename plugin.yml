main: deimophobe.dvz.DvZPlugin
name: CustomDvZ
version: 1.0
author: Deimo
description: Deimo's custom dvz thing
commands:
  setdwarf:
    usage: /setdwarf <name> [<sword> <bow> <ale> <armour> <title>]
  setmob:
    usage: /setmob <name>
  spawnmob:
    usage: /setmob <name> <mobtype>
  removeplayer:
    usage: /removeplayer <name>
  horn:
    usage: /horn
    description: HRON
  trash:
    description: For deleting your duplicate items.
    aliases: fawn
  who:
    description: Who is what and where is why
    aliases: list
  toggleais:
    usage: /toggleais
    description: Enables/disables AI spawning.
  toggledoom:
    usage: /toggledoom
    description: Enables/disables doom clock.