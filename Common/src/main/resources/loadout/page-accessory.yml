# ------ PASSIVES ------
compass:
  index: 0
  category: accessory
  type: item
  name: compass
  cost: 0
  item:
    name: "Compass"
    material: compass
    lore:
      description:
       - "Right click to cycle through\n
          key locations."
chesto:
  index: 1
  category: accessory
  type: item
  name: chesto
  cost: 0
  item:
    name: "Chestomatic"
    base: chestomatic
    lore:
      description:
       - "Gives you a portable shared\n
          resource chest."
clock:
  index: 2
  category: accessory
  type: item
  name: clock
  cost: 0
  item:
    name: "Gnomish Clock"
    base: clock
    lore:
      description:
       - "Gives you a clock."

slowfall:
  index: 3
  category: accessory
  type: item
  name: slowfall
  cost: 4
  item:
    name: "Slowfall"
    base: slowfall
    lore:
      description:
       - "SHIFT to give yourself Jump Boost\n
          and a slowfalling effect."
darkvision:
  index: 4
  category: accessory
  type: item
  name: darkvision
  cost: 4
  item:
    name: "Dark Vision"
    base: darkvision
    lore:
      description:
       - "Press and hold shift to give\n
          yourself a Night Vision effect."
avenge:
  index: 5
  category: accessory
  type: item
  name: avenge
  cost: 4
  item:
    name: "Avenge"
    base: avenge
    lore:
      description:
       - "Gain a PROC when a dwarf dies."

tombmaker:
  index: 6
  category: accessory
  type: item
  name: tombmaker
  cost: 4
  item:
    name: "Tombmaker"
    base: tombmaker
    lore:
      description:
       - "Replaces your shovel with a tombmaker\n
          allowing you to dig faster and be more\n
          likely to find items in gravel."

resurrection:
  index: 7
  category: accessory
  type: item
  name: resurrection
  cost: 8
  item:
    name: "Resurrection"
    base: resurrection
    lore:
      description:
       - "You shall be resurrected once upon death.\n
          This resurrection will heal you, but will\n
          also permanently cost you 5 hearts."

bricklayer:
  index: 8
  category: accessory
  type: item
  name: bricklayer
  cost: 2
  item:
    name: "Bricklayer"
    base: bricklayer
    lore:
      description:
       - "With this item, left click to select\n
          two corners of a region, and right click\n
          to automatically place cobblestone.\n
          Requires cobblestone in your inventory.\n
          Faster during build phase."



