warrior-class:
  index: 0
  cost: 64
  category: kit
  type: multi
  pieces:
    - runesword
    - phoenix_bow
    - safety_juice
    - sturdy
    - avenge
    - resurrection
  consumables:
    torch: 64
    mortar: 64
    cobblestone: 192
    wrench: 2
  item:
    template: "loadout-class"
    name: "Warrior Kit"
    base: runesword
    lore:
      description:
       - "The basic all around fighter with the \n
          ability to dash and constantly rampage\n
          as well as automated healing."

      contains:
       - "*Mystic Runesword\n
          *Phoenix Bow\n
          *Safety Juice\n
          *Sturdy Armour\n
          *Avenge\n
          *Resurrection\n
          *64 Torches\n
          *64 Mortar\n
          *192 Cobblestone\n
          *2 Wrenches"

ranger-class:
  index: 1
  cost: 64
  category: kit
  type: multi
  pieces:
    - dagger
    - longbow
    - quiver
    - pendant
    - darkvision
  consumables:
    torch: 64
    mortar: 64
    cobblestone: 192
    charm: 1
    wizard_mortar: 32
    lamp: 64
  item:
    template: "loadout-class"
    name: "Ranger Kit"
    base: longbow
    lore:
      description:
       - "Quick and agile, The Ranger is a perfect\n
          choice for single target combat.\n
          With the ability to poison and eviscerate\n
          as well as fire hard hitting bow shots."

      contains:
       - "*Elven Dagger\n
          *Rangers Longbow\n
          *Ruby Pendant\n
          *Massive Quiver\n
          *Darkvision\n
          *64 Torches\n
          *64 Mortar\n
          *192 Cobblestone\n
          *1 Consecrating Charm\n
          *32 Wizard Mortar\n
          *64 Enchanted Lamps"

berserker-class:
  index: 2
  cost: 64
  category: kit
  type: multi
  pieces:
    - blood_axe
    - crossbow
    - strong_ale
    - berserker
    - avenge
  consumables:
    torch: 64
    mortar: 64
    cobblestone: 192
    wrench: 2
  item:
    template: "loadout-class"
    name: "Berserker Kit"
    base: blood-axe
    lore:
      description:
       - "Brute strength is all that matters. \n
          With less defense and higher mobility\n
          These fighters cut through foes like butter\n
          but can be taken down just as fast."

      contains:
       - "*Bloodied Waraxe\n
          *Crossbow\n
          *Strong Ale\n
          *Berserker Armour\n
          *Avenge\n
          *64 Torches\n
          *64 Mortar\n
          *192 Cobblestone\n
          *2 Wrenches"

elven-class:
  index: 3
  cost: 64
  category: kit
  type: multi
  pieces:
    - dagger
    - lightbow
    - safety_juice
    - studded
    - nature_suit
    - slowfall
    - avenge
  consumables:
    wizard_mortar: 32
    cobblestone: 192
    wrench: 2
    charm: 2
    proc_bottle: 3
  item:
    template: "loadout-class"
    name: "Elven Kit"
    base: dagger
    lore:
      description:
       - "Unlike their Ranger counterparts, this class\n
          makes you feel like an elf, with increased speed, \n
          low light vision, and quick strikes."

      contains:
       - "*Dagger\n
          *Lightbow\n
          *Safety Juice\n
          *Studded Armour\n
          *Taproot Armour\n
          *Slowfall\n
          *Avenge\n
          *32 Wizard Mortar\n
          *192 Cobblestone\n
          *2 Wrenches\n
          *2 Consecrating Charms\n
          *3 Proc in a Bottles"

