          the Gnomes were able to\n
          sustain their rate of fire."

      contains:
       - "*Hammer\n
          *Volcanic Gauntlet\n
          *Ruby Pendant\n
          *Massive Quiver\n
          *Avenge\n
          *64 Torches\n
          *64 Mortar\n
          *192 Cobblestone\n
          *2 Consecrating Charms\n
          *3 Slabs"

